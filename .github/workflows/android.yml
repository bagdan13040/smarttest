name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}-v4

      - name: Install Android SDK platform
        run: |
          # Use pre-installed SDK on GH Actions runner
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          # Accept licenses and install platform 33
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "platform-tools"
          
          # Verify installation
          ls -d $ANDROID_SDK_ROOT/platforms/android-33
        shell: bash

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: master
          command: buildozer android debug
          repository_display_name: SmartTest
        env:
          USER: root
          PIP_BREAK_SYSTEM_PACKAGES: 1
          ANDROID_SDK_HOME: /home/runner/work/smarttest/smarttest/
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
